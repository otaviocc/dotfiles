gui:
  screenMode: 'halt'
  showCommandLog: false
  showBottomLine: false
  showListFooter: false
  portraitMode: 'always'
  # Kanagawa Dragon — hand-ported. kanagawa.nvim ships no lazygit extra (its
  # extras/ covers terminals, tmTheme, base16 and editors only), so unlike the
  # previous two themes this block is assembled here from the semantic roles in
  # docs/palette.md rather than copied from upstream.
  #
  # `selectedLineBgColor` is Dragon's own `bg_visual` (waveBlue1 #223249), the
  # one cool colour in an otherwise warm theme — upstream uses it for exactly
  # this and nothing else in the palette gives a selected row enough contrast.
  theme:
    activeBorderColor:
      - '#c4b28a'
      - bold
    inactiveBorderColor:
      - '#625e5a'
    searchingActiveBorderColor:
      - '#dca561'
      - bold
    optionsTextColor:
      - '#8ba4b0'
    selectedLineBgColor:
      - '#223249'
    inactiveViewSelectedLineBgColor:
      - '#282727'
    cherryPickedCommitFgColor:
      - '#c4b28a'
    cherryPickedCommitBgColor:
      - '#282727'
    markedBaseCommitFgColor:
      - '#8ba4b0'
    markedBaseCommitBgColor:
      - '#dca561'
    unstagedChangesColor:
      - '#c34043'
    defaultFgColor:
      - '#c5c9c5'
  authorColors:
    '*': '#8992a7'
