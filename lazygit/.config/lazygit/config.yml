gui:
  screenMode: 'halt'
  showCommandLog: false
  showBottomLine: false
  showListFooter: false
  portraitMode: 'always'
  # Default+. Vendored from ~/Developer/default-plus (lazygit/theme.yml),
  # which is generated by that repo's bin/build.py — re-copy it rather than
  # editing here. lazygit has no upstream Default+ extra, so every slot is
  # assigned from the semantic roles in docs/palette.md.
  theme:
    activeBorderColor:
      - '#35B0D8'
      - bold
    inactiveBorderColor:
      - '#4C4C4C'
    searchingActiveBorderColor:
      - '#FFE76D'
      - bold
    optionsTextColor:
      - '#35B0D8'
    selectedLineBgColor:
      - '#515B70'
    inactiveViewSelectedLineBgColor:
      - '#242424'
    cherryPickedCommitFgColor:
      - '#FFE76D'
    cherryPickedCommitBgColor:
      - '#242424'
    markedBaseCommitFgColor:
      - '#171717'
    markedBaseCommitBgColor:
      - '#FFE76D'
    unstagedChangesColor:
      - '#FC4651'
    defaultFgColor:
      - '#FFFFFF'
  authorColors:
    '*': '#8E8E8E'
