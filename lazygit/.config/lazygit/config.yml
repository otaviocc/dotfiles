gui:
  screenMode: 'halt'
  showCommandLog: false
  showBottomLine: false
  showListFooter: false
  portraitMode: 'always'
  # Catppuccin Mocha, mauve accent — verbatim from
  # https://github.com/catppuccin/lazygit themes/mocha/mauve.yml.
  # Palette: see docs/palette.md.
  theme:
    activeBorderColor:
      - '#cba6f7'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    inactiveViewSelectedLineBgColor:
      - '#6c7086'
    cherryPickedCommitFgColor:
      - '#cba6f7'
    cherryPickedCommitBgColor:
      - '#45475a'
    markedBaseCommitFgColor:
      - '#89b4fa'
    markedBaseCommitBgColor:
      - '#f9e2af'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
  authorColors:
    '*': '#b4befe'
