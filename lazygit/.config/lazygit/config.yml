gui:
  screenMode: 'halt'
  showCommandLog: false
  showBottomLine: false
  showListFooter: false
  portraitMode: 'always'
  # Catppuccin Mocha, mauve accent — copied verbatim from catppuccin/lazygit
  # (themes-mergable/mocha/mauve.yml). The previous Kanagawa theme had to be
  # assembled here by hand from docs/palette.md because kanagawa.nvim ships no
  # lazygit extra; Catppuccin has an official port, so nothing below is this
  # repo's invention. Keep it that way — re-copy rather than hand-edit.
  theme:
    activeBorderColor:
      - '#cba6f7'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    inactiveViewSelectedLineBgColor:
      - '#6c7086'
    cherryPickedCommitFgColor:
      - '#cba6f7'
    cherryPickedCommitBgColor:
      - '#45475a'
    markedBaseCommitFgColor:
      - '#89b4fa'
    markedBaseCommitBgColor:
      - '#f9e2af'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
  authorColors:
    '*': '#b4befe'
