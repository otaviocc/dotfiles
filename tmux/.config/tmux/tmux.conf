### tmux.conf — shared across Fedora and macOS (Zsh + Ctrl-a + vi keys)
#
# OS-specific bits (default shell path, clipboard integration) live in
# tmux.linux.conf / tmux.macos.conf, both tracked in this repo and loaded
# automatically at the end of this file via `if-shell`.
#
# ---------------------------------------------------------------------------
# KEY MAP — prefix is Ctrl-a. Keys marked * are tmux defaults, listed here
# only for reference. The rest mirror herdr's bindings, mapping
# herdr workspace -> tmux session, herdr tab -> tmux window, pane -> pane.
#
#   Windows (herdr calls them tabs)
#     c            new window                      1..9 *  select window
#     n / p        next / previous window          /       last window
#     T            rename window                   X       kill window (asks)
#
#   Panes
#     v            split side by side              -       split stacked
#                                                  s       alias for -
#     h j k l      focus left/down/up/right        o       last pane
#     Tab / S-Tab  cycle panes forward / back      P       rename pane title
#     { / }        swap pane up / down             x *     kill pane (asks)
#     z *          zoom pane                       q *     show pane numbers
#     r            resize mode: h/j/k/l to resize, = to even out, Esc to exit
#
#   Sessions (herdr calls them workspaces)
#     w            session picker                  C-s     session list
#     N            new session                     W       rename session
#     d *          detach                          D       kill session (asks)
#
#   Copy mode and scrollback (vi keys)
#     Escape       enter copy mode                 v       start selection
#     y            copy selection                  ] *     paste buffer
#     e            open the scrollback in $EDITOR
#
#   Misc
#     b            toggle the status bar           R       reload this file
#     ? *          list every binding
# ---------------------------------------------------------------------------

### Prefix remap: Ctrl-b -> Ctrl-a
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

### Terminal
set -g default-terminal "tmux-256color"
# True colour, so the Vesper hex palette below renders exactly.
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc,alacritty:Tc"

### Behaviour
set -g mouse on
set -g status-keys vi
set -g mode-keys vi
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g allow-rename off

# Quiet: no bells, no activity flashes.
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none
setw -g monitor-activity off

### LOOK & FEEL — Vesper ###
# Palette (see README "The Vesper theme"); same hexes as nvim/vigia/hunk:
#   bg #101010  panel #161616  selection #232323  fg #ffffff
#   muted #505050  muted-text #7e7e7e
#   red #ff8080  green #90b99f  yellow #ffc799  pink #f591b2
#   magenta #ecaad6  lilac #b9aeda
# Aiming for herdr's quiet chrome: dark bar, greyed inactive text, creamy
# yellow (#ffc799) as the single accent.
#
# Hex must stay lowercase: tmux format-expands style strings, and #F, #I, #W,
# #S, #T, #P, #H, #D are legacy specifiers — `bg=#FFC799` expands to the
# nonsense `bg=*FC799`, while `bg=#ffc799` survives.

## Status bar: a tab strip along the top, each window a chip, current one filled
set -g status-position top
set -g status-justify left
set -g status-style bg=#161616,fg=#7e7e7e
set -g window-status-style fg=#7e7e7e,bg=#232323
set -g window-status-current-style fg=#101010,bg=#ffc799,bold
set -g window-status-activity-style fg=#b9aeda,bg=#232323
set -g window-status-bell-style fg=#ff8080,bg=#232323
set -g window-status-separator " "
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g status-left-length 20
set -g status-left "#[fg=#ffc799,bold]#S #[fg=#505050]· "
set -g status-right-length 65
set -g status-right "#[fg=#505050]%H:%M #[fg=#7e7e7e]%d-%b-%y "
set -g status-interval 5

## Panes: dim borders in the background, creamy yellow where focus is
set -g pane-border-style fg=#232323
set -g pane-active-border-style fg=#ffc799
set -g pane-border-line single
set -g pane-border-indicator colour
set -g display-panes-colour "#505050"
set -g display-panes-active-colour "#ffc799"

# Labels on the top border, like herdr's agent labels. tmux seeds pane_title
# with the hostname, so fall back to the running command until prefix+P names
# the pane.
set -g pane-border-status top
set -g pane-border-format "#[fg=#232323]─ #{?pane_active,#[fg=#ffc799],#[fg=#505050]}#{pane_index}#[fg=#7e7e7e] #{?#{==:#{pane_title},#{host_short}},#{pane_current_command},#{pane_title}}#{?window_zoomed_flag,#[fg=#ffc799] [zoom],} #[fg=#232323]"

## Messages, prompts, copy mode and menus
set -g message-style bg=#161616,fg=#ffc799
set -g message-command-style bg=#161616,fg=#90b99f
set -g mode-style bg=#232323,fg=#ffffff
set -g copy-mode-match-style bg=#232323,fg=#ffc799
set -g copy-mode-current-match-style bg=#ffc799,fg=#101010
set -g menu-style bg=#161616,fg=#7e7e7e
set -g menu-selected-style bg=#232323,fg=#ffc799
set -g menu-border-style fg=#232323

### KEY BINDINGS ###
# See the key map at the top of this file. Only the non-obvious ones are
# commented below.

## Windows
bind-key c new-window
bind-key n next-window
bind-key p previous-window
bind-key T command-prompt -I "#W" "rename-window '%%'"
bind-key X confirm-before -p "kill window #W? (y/n)" kill-window
bind-key '/' last-window

## Panes
# herdr names a split after its divider, so v (vertical divider) puts panes
# side by side and - (horizontal divider) stacks them.
bind-key v split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key Tab select-pane -t :.+
bind-key BTab select-pane -t :.-
bind-key o select-pane -l
bind-key P command-prompt -I "#{pane_title}" "select-pane -T '%%'"
bind-key '{' swap-pane -D
bind-key '}' swap-pane -U

# Resize mode: a key table that re-arms itself, so hjkl repeats until Esc.
bind-key r display-message "resize: h/j/k/l  •  = even  •  esc to exit" \; switch-client -T resize
bind-key -T resize h resize-pane -L 3 \; switch-client -T resize
bind-key -T resize j resize-pane -D 3 \; switch-client -T resize
bind-key -T resize k resize-pane -U 3 \; switch-client -T resize
bind-key -T resize l resize-pane -R 3 \; switch-client -T resize
bind-key -T resize '=' select-layout -E \; switch-client -T resize
bind-key -T resize Escape switch-client -T root
bind-key -T resize q switch-client -T root
bind-key -T resize Enter switch-client -T root

## Sessions
bind-key w choose-tree -Zs
bind-key N new-session
bind-key W command-prompt -I "#S" "rename-session '%%'"
bind-key D confirm-before -p "kill session #S? (y/n)" kill-session
bind-key C-s choose-session

## Copy mode and scrollback
bind-key Escape copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Dump the scrollback to a temp file and open it, like herdr's edit_scrollback.
bind-key e run-shell -b 'f=$(mktemp "${TMPDIR:-/tmp}/tmux-scrollback.XXXXXX"); tmux capture-pane -p -S -10000 -t "#{pane_id}" > "$f"; tmux new-window -n scrollback "${EDITOR:-nvim} \"$f\""'

## Misc
# herdr's prefix+b toggles its sidebar; the nearest tmux chrome is the status bar.
bind-key b set -g status
bind-key R source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

### OS-specific: default shell + clipboard integration
if-shell "uname | grep -q Darwin" \
  "source-file ~/.config/tmux/tmux.macos.conf" \
  "source-file ~/.config/tmux/tmux.linux.conf"
