### tmux.conf — shared across Fedora and macOS (Zsh + Ctrl-a + vi keys)
#
# OS-specific bits (default shell path, clipboard integration) live in
# tmux.linux.conf / tmux.macos.conf, both tracked in this repo and loaded
# automatically below via `if-shell`, so no per-machine setup is needed.

### Prefix remap: Ctrl-b -> Ctrl-a
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

set -g default-terminal "xterm-256color"

### LOOK & FEEL ###
set -g status-style bg=colour235,fg=colour179
set -g window-status-style fg=colour244,bg=default
set -g window-status-current-style fg=colour166,bg=default,bright

set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=green
set -g pane-border-line double

set -g display-panes-active-colour colour33
set -g display-panes-colour colour166

set -g status-right-length 65
set -g status-interval 5

set -g mouse on
set -g status-keys vi
set -g mode-keys vi
set -sg escape-time 0

set -g base-index 1
setw -g pane-base-index 1

### Status bar layout
set -g status-position bottom
set -g status-justify centre
set -g status-left-length 20
set -g status-left "#[fg=green]Session: #S "
set -g status-right "#[bg=colour235,fg=colour179]%H:%M %d-%b-%y"

### Key bindings ###
bind-key c new-window
bind-key '/' last-window

# Splits:
# - s = vertical split (pane below)  -> -v
# - v = horizontal split (pane right) -> -h
bind-key s split-window -v -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"

unbind '"'
unbind %

# Vim-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Pane swapping
bind-key '{' swap-pane -D
bind-key '}' swap-pane -U

# Reload
bind-key r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

# Select previously active pane
bind-key o select-pane -l

# Copy mode
bind-key Escape copy-mode
bind-key p paste-buffer

# Window navigation
bind-key '[' previous-window
bind-key ']' next-window

# Vi copy-mode (tmux 3.5a+)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Choose session
bind-key C-s choose-session

### Quiet notifications
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none
setw -g monitor-activity off

### Don't rename windows automatically
set -g allow-rename off

### OS-specific: default shell + clipboard integration
if-shell "uname | grep -q Darwin" \
  "source-file ~/.config/tmux/tmux.macos.conf" \
  "source-file ~/.config/tmux/tmux.linux.conf"
