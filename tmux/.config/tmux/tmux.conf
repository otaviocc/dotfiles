### tmux.conf — shared across Fedora and macOS (Zsh + Ctrl-a + vi keys)
#
# OS-specific bits (default shell path, clipboard integration) live in
# tmux.linux.conf / tmux.macos.conf, both tracked in this repo and loaded
# automatically at the end of this file via `if-shell`.
#
# ---------------------------------------------------------------------------
# KEY MAP — prefix is Ctrl-a. Keys marked * are tmux defaults, listed here
# only for reference. The rest mirror herdr's bindings, mapping
# herdr workspace -> tmux session, herdr tab -> tmux window, pane -> pane.
#
#   Windows (herdr calls them tabs)
#     c            new window                      1..9 *  select window
#     n / p        next / previous window          /       last window
#     T            rename window                   X       kill window (asks)
#
#   Panes
#     v            split side by side              -       split stacked
#     h j k l      focus left/down/up/right        o       last pane
#     Tab / S-Tab  cycle panes forward / back      P       rename pane title
#     { / }        swap pane up / down             x *     kill pane (asks)
#     z *          zoom pane                       q *     show pane numbers
#     r            resize mode: h/j/k/l to resize, = to even out, Esc to exit
#
#   Sessions (herdr calls them workspaces)
#     s / w        session picker                  C-s     session list
#     N            new session                     W       rename session
#     d *          detach                          D       kill session (asks)
#
#   Copy mode and scrollback (vi keys)
#     Escape       enter copy mode                 v       start selection
#     y            copy selection                  ] *     paste buffer
#     e            open the scrollback in $EDITOR
#
#   Misc
#     b            toggle the status bar           R       reload this file
#     ? *          list every binding
# ---------------------------------------------------------------------------

### Prefix remap: Ctrl-b -> Ctrl-a
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

### Terminal
set -g default-terminal "tmux-256color"
# True colour, so the Kanagawa Dragon hex palette below renders exactly.
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc,alacritty:Tc"

### Behaviour
set -g mouse on
set -g status-keys vi
set -g mode-keys vi
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g allow-rename off

# Quiet: no bells, no activity flashes.
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none
setw -g monitor-activity off

### LOOK & FEEL — Kanagawa Dragon ###
# Palette (the full table lives in docs/palette.md); same hexes as vigia/hunk:
#   bg #181616  bg_m2 #12120f  bg_p1 #282727  bg_m3 #0d0c0c
#   whitespace #625e5a  comment #737c73  fg #c5c9c5
#   red #c4746e  green #8a9a7b  orange #b6927b  violet #8992a7
#   yellow #c4b28a  selection #223249
# Aiming for herdr's quiet chrome: dark bar, greyed inactive text, warm yellow
# (#c4b28a) as the single accent. Kanagawa declares no single accent the way
# Catppuccin parameterizes one, so yellow is a choice made here — it is the
# closest thing in Dragon to the warm sandy the old Vesper config used.
# Chrome sits on bg_m2, one step darker than the terminal's own bg, which is
# what keeps the tab strip legible against ghostty's #181616 background.
#
# Text sitting *on* a filled accent chip uses bg_m3 (#0d0c0c), the darkest
# level, since the accent is light and warm.
#
# copy-mode selection uses #223249 (Dragon's own bg_visual) rather than a warm
# grey — it is the one cool colour Kanagawa keeps in Dragon, and nothing warm
# in the palette gives a selected region enough contrast.
#
# Hex must stay lowercase: tmux format-expands style strings, and #F, #I, #W,
# #S, #T, #P, #H, #D are legacy specifiers — `bg=#C4B28A` expands to the
# nonsense `bg=*4B28A`, while `bg=#c4b28a` survives.

## Status bar: a tab strip along the top, each window a chip, current one filled
set -g status-position top
set -g status-justify left
set -g status-style bg=#12120f,fg=#737c73
set -g window-status-style fg=#737c73,bg=#282727
set -g window-status-current-style fg=#0d0c0c,bg=#c4b28a,bold
set -g window-status-activity-style fg=#8992a7,bg=#282727
set -g window-status-bell-style fg=#c4746e,bg=#282727
set -g window-status-separator " "
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
# A dot ahead of the session name reports which key table is armed: dark and
# near-invisible normally, yellow the moment prefix+a is pressed, violet while
# the sticky resize table is active. It is always drawn so the tab strip never
# shifts sideways. Styles inside the conditional must stay comma-free — commas
# separate the ?: arms. The resize test comes first: tmux keeps client_prefix
# set while a switch-client key table is armed, so checking it first would
# always win.
set -g status-left-length 24
set -g status-left "#{?#{==:#{client_key_table},resize},#[fg=#8992a7],#{?client_prefix,#[fg=#c4b28a],#[fg=#282727]}}● #[fg=#c4b28a bold]#S #[fg=#625e5a]· "
set -g status-right-length 65
set -g status-right "#[fg=#625e5a]%H:%M #[fg=#737c73]%d-%b-%y "
set -g status-interval 5

## Panes: dim borders in the background, warm yellow where focus is
set -g pane-border-style fg=#282727
set -g pane-active-border-style fg=#c4b28a
set -g pane-border-line single
set -g pane-border-indicator colour
set -g display-panes-colour "#625e5a"
set -g display-panes-active-colour "#c4b28a"

# Labels on the top border, like herdr's agent labels. tmux seeds pane_title
# with the hostname, so fall back to the running command until prefix+P names
# the pane.
set -g pane-border-status top
set -g pane-border-format "#[fg=#282727]─ #{?pane_active,#[fg=#c4b28a],#[fg=#625e5a]}#{pane_index}#[fg=#737c73] #{?#{==:#{pane_title},#{host_short}},#{pane_current_command},#{pane_title}}#{?window_zoomed_flag,#[fg=#c4b28a] [zoom],} #[fg=#282727]"

## Messages, prompts, copy mode and menus
# `fill` is what keeps the prompt from landing on top of the window chips:
# tmux draws messages and the prefix+: prompt over the existing status line and
# only repaints the cells it writes, so without a fill colour the tabs stay
# visible right behind the text. tmux's own default carries fill=yellow; set
# ours to the status background so the whole row clears while typing.
set -g message-style bg=#12120f,fg=#c4b28a,fill=#12120f
set -g message-command-style bg=#12120f,fg=#8a9a7b,fill=#12120f
set -g mode-style bg=#223249,fg=#c5c9c5
set -g copy-mode-match-style bg=#223249,fg=#c4b28a
set -g copy-mode-current-match-style bg=#c4b28a,fg=#0d0c0c
set -g menu-style bg=#12120f,fg=#737c73
set -g menu-selected-style bg=#282727,fg=#c4b28a
set -g menu-border-style fg=#282727

### KEY BINDINGS ###
# See the key map at the top of this file. Only the non-obvious ones are
# commented below.

## Windows
bind-key c new-window
bind-key n next-window
bind-key p previous-window
bind-key T command-prompt -I "#W" "rename-window '%%'"
bind-key X confirm-before -p "kill window #W? (y/n)" kill-window
bind-key '/' last-window

## Panes
# herdr names a split after its divider, so v (vertical divider) puts panes
# side by side and - (horizontal divider) stacks them.
bind-key v split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key Tab select-pane -t :.+
bind-key BTab select-pane -t :.-
bind-key o select-pane -l
bind-key P command-prompt -I "#{pane_title}" "select-pane -T '%%'"
bind-key '{' swap-pane -D
bind-key '}' swap-pane -U

# Resize mode: a key table that re-arms itself, so hjkl repeats until Esc.
bind-key r display-message "resize: h/j/k/l  •  = even  •  esc to exit" \; switch-client -T resize
bind-key -T resize h resize-pane -L 3 \; switch-client -T resize
bind-key -T resize j resize-pane -D 3 \; switch-client -T resize
bind-key -T resize k resize-pane -U 3 \; switch-client -T resize
bind-key -T resize l resize-pane -R 3 \; switch-client -T resize
bind-key -T resize '=' select-layout -E \; switch-client -T resize
bind-key -T resize Escape switch-client -T root
bind-key -T resize q switch-client -T root
bind-key -T resize Enter switch-client -T root

## Sessions
bind-key s choose-tree -Zs
bind-key w choose-tree -Zs
bind-key N new-session
bind-key W command-prompt -I "#S" "rename-session '%%'"
bind-key D confirm-before -p "kill session #S? (y/n)" kill-session
bind-key C-s choose-session

## Copy mode and scrollback
bind-key Escape copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Dump the scrollback to a temp file and open it, like herdr's edit_scrollback.
bind-key e run-shell -b 'f=$(mktemp "${TMPDIR:-/tmp}/tmux-scrollback.XXXXXX"); tmux capture-pane -p -S -10000 -t "#{pane_id}" > "$f"; tmux new-window -n scrollback "${EDITOR:-nvim} \"$f\""'

## Misc
# herdr's prefix+b toggles its sidebar; the nearest tmux chrome is the status bar.
bind-key b set -g status
bind-key R source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

### OS-specific: default shell + clipboard integration
if-shell "uname | grep -q Darwin" \
  "source-file ~/.config/tmux/tmux.macos.conf" \
  "source-file ~/.config/tmux/tmux.linux.conf"
