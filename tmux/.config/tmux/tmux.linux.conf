### Linux (Fedora)-only tmux settings. Sourced automatically by tmux.conf.

set -g default-command "/usr/bin/zsh"

# Clipboard integration (Fedora)
# Works if you have xclip (X11) or wl-clipboard (Wayland) installed.
# - If you only use one environment, install the other or ignore that command.
# X11: xclip
# Wayland: wl-copy
set -g @clip_xclip_cmd "xclip -selection clipboard -in"
set -g @clip_wl_cmd "wl-copy"

# Copy selection to system clipboard (vi copy-mode)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{?client_termfeatures,#{@clip_xclip_cmd},#{@clip_wl_cmd}}"

# Mouse drag end to clipboard (if supported)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{?client_termfeatures,#{@clip_xclip_cmd},#{@clip_wl_cmd}}"

# Double/Triple click to select word/line then copy to clipboard
bind-key -T copy-mode-vi DoubleClick1Pane \
  select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "#{?client_termfeatures,#{@clip_xclip_cmd},#{@clip_wl_cmd}}"

bind-key -T copy-mode-vi TripleClick1Pane \
  select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear "#{?client_termfeatures,#{@clip_xclip_cmd},#{@clip_wl_cmd}}"
