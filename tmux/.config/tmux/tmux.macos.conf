### macOS-only tmux settings. Sourced automatically by tmux.conf.
#
# NOTE: previously "/opt/homebrew/bin/fish" (old dot.config repo used fish).
# Switched to zsh to match the "zsh everywhere" decision. Adjust the path if
# your Mac's zsh lives elsewhere (`which zsh`).
set-option -g default-command "/bin/zsh"

# System clipboard integration (macOS)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "pbcopy"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear "pbcopy"

bind-key C-c run "tmux save-buffer - | pbcopy"
bind-key C-v run "tmux set-buffer \"$(pbpaste)\"; tmux paste-buffer"
