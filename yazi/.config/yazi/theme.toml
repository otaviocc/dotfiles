# yazi theme — Catppuccin Mocha (mauve accent).
#
# Vendored from catppuccin/yazi (themes/mocha/catppuccin-mocha-mauve.toml),
# with exactly two deliberate changes from upstream:
#
#   1. `syntect_theme` is repointed at the bat package's vendored tmTheme
#      rather than upstream's own copy, so code previews and `bat` stay in
#      sync from one file. Upstream ships it as a `~/`-prefixed path; yazi 26.x
#      rejects relative paths and does NOT expand `~`, but it does expand
#      environment variables, so it must be written with $HOME. A bad path
#      fails silently — yazi falls back to its built-in dark theme rather than
#      erroring, the same trap as bat's `--theme`.
#   2. Upstream's `[icon]` section is dropped. Only theme.toml is tracked in
#      this repo and the icon preset is left on yazi's built-in default.
#
# Everything else is upstream verbatim. The previous Kanagawa version had to be
# hand-ported because both kanagawa flavors in the wild are Wave or drag Wave
# leftovers; Catppuccin needs no such work. Palette: see docs/palette.md.

[app]
overall = { bg = "#1e1e2e" }

[mgr]
cwd = { fg = "#94e2d5" }

find_keyword  = { fg = "#f9e2af", italic = true }
find_position = { fg = "#f5c2e7", bg = "reset", italic = true }

marker_copied   = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut      = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked   = { fg = "#94e2d5", bg = "#94e2d5" }
marker_selected = { fg = "#cba6f7", bg = "#cba6f7" }

count_copied   = { fg = "#1e1e2e", bg = "#a6e3a1" }
count_cut      = { fg = "#1e1e2e", bg = "#f38ba8" }
count_selected = { fg = "#1e1e2e", bg = "#cba6f7" }

border_symbol = "│"
border_style  = { fg = "#7f849c" }

syntect_theme = "$HOME/.config/bat/themes/catppuccin-mocha.tmTheme"

[tabs]
active   = { fg = "#1e1e2e", bg = "#cdd6f4", bold = true }
inactive = { fg = "#cdd6f4", bg = "#45475a" }

[mode]
normal_main = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
normal_alt  = { fg = "#cba6f7", bg = "#313244"}

select_main = { fg = "#1e1e2e", bg = "#a6e3a1", bold = true }
select_alt  = { fg = "#a6e3a1", bg = "#313244"}

unset_main  = { fg = "#1e1e2e", bg = "#f2cdcd", bold = true }
unset_alt   = { fg = "#f2cdcd", bg = "#313244"}

[indicator]
parent = { fg = "#1e1e2e", bg = "#cdd6f4" }
current = { fg = "#1e1e2e", bg = "#cba6f7" }
preview = { fg = "#1e1e2e", bg = "#cdd6f4" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#a6e3a1", bg = "#45475a" }
progress_error  = { fg = "#f9e2af", bg = "#f38ba8" }

perm_type  = { fg = "#89b4fa" }
perm_read  = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec  = { fg = "#a6e3a1" }
perm_sep   = { fg = "#7f849c" }

[input]
border   = { fg = "#cba6f7" }
title    = {}
value    = {}
selected = { reversed = true }

[pick]
border   = { fg = "#cba6f7" }
active   = { fg = "#f5c2e7" }
inactive = {}

[confirm]
border     = { fg = "#cba6f7" }
title      = { fg = "#cba6f7" }
body       = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}

[cmp]
border = { fg = "#cba6f7" }

[tasks]
border  = { fg = "#cba6f7" }
title   = {}
hovered = { fg = "#f5c2e7", bold = true }

[which]
border          = { fg = "#cba6f7" }
mask            = {}
cand            = { fg = "#94e2d5" }
rest            = { fg = "#9399b2" }
desc            = { fg = "#f5c2e7" }
separator       = "  "
separator_style = { fg = "#585b70" }

[help]
border  = { fg = "#cba6f7" }
chord   = { fg = "#94e2d5" }
action  = { fg = "#9399b2" }
hovered = { bg = "#585b70", bold = true }

[notify]
title_info  = { fg = "#94e2d5" }
title_warn  = { fg = "#f9e2af" }
title_error = { fg = "#f38ba8" }

[filetype]
rules = [
	# Media
	{ mime = "**/image/*", fg = "#f9e2af" },
	{ mime = "**/{audio,video}/*", fg = "#f5c2e7" },

	# Archives
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f38ba8" },

	# Documents
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#89dceb" },

	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#45475a" },

	# Special file
	{ url = "*", is = "orphan", bg = "#f38ba8" },
	{ url = "*", is = "exec"  , fg = "#a6e3a1" },

	# Dummy file
	{ url = "*", is = "dummy", bg = "#f38ba8" },
	{ url = "*/", is = "dummy", bg = "#f38ba8" },

	# Fallback
	{ url = "*/", fg = "#cba6f7" },
]

[spot]
border = { fg = "#cba6f7" }
title  = { fg = "#cba6f7" }
tbl_cell = { fg = "#cba6f7", reversed = true }
tbl_col = { bold = true }

