#:schema https://yazi-rs.github.io/schemas/theme.json
# Yazi — Default+. Hand-ported from the semantic roles in docs/palette.md.
#
# Default+ began as an Xcode theme and has no yazi flavor at all, so — like
# lazygit, tig, tmux and vigia — this block is assembled here rather than
# copied from upstream. Upstream for the palette itself is
# ~/Developer/default-plus (palette.yaml).
#
# Chrome decisions:
# - The manager border is the accent (declaration #35B0D8), matching lazygit's
#   activeBorderColor; every dialog border drops to the muted accent #266478.
# - Mode/tab chips: normal = accent, select = system_member, unset = url;
#   text on a filled chip is the background #171717, as in tig's cursor rows.
# - Directory rows and the cwd field are the accent, matching LS_COLORS and
#   tig (`di` and `directory` are the accent across the repo).
# - The status bar is panel_background, the palette's "panels" role.
# - `syntect_theme` reuses the .tmTheme vendored for bat, so code previews
#   carry the same grammar as a running `bat`. The value must be an absolute
#   path; yazi expands $HOME but not `~`. Any load error falls back silently
#   to its built-in dark theme (same trap as bat's --theme), so check the path
#   if a preview renders monochrome.
#
# Only the chrome is themed; the [icon] table keeps the built-in preset's
# brand-coloured glyphs.

[mgr]
cwd = { fg = "#35B0D8" }

# Find
find_keyword  = { fg = "#FFE76D", bold = true, italic = true }
find_position = { fg = "#FFFFFF", bg = "#515B70", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#41B645", bg = "#41B645" }
marker_cut      = { fg = "#F74A4A", bg = "#F74A4A" }
marker_marked   = { fg = "#AB64FF", bg = "#AB64FF" }
marker_selected = { fg = "#35B0D8", bg = "#35B0D8" }

# Count
count_copied   = { fg = "#171717", bg = "#41B645" }
count_cut      = { fg = "#171717", bg = "#F74A4A" }
count_selected = { fg = "#171717", bg = "#35B0D8" }

# Border
border_style = { fg = "#35B0D8" }

# Code preview — the bat package's vendored Default+ tmTheme
syntect_theme = "$HOME/.config/bat/themes/default-plus.tmTheme"

[tabs]
active   = { fg = "#171717", bg = "#35B0D8", bold = true }
inactive = { fg = "#8E8E8E", bg = "#242424" }

[mode]
normal_main = { fg = "#171717", bg = "#35B0D8", bold = true }
normal_alt  = { fg = "#35B0D8", bg = "#111111" }

select_main = { fg = "#171717", bg = "#AB64FF", bold = true }
select_alt  = { fg = "#AB64FF", bg = "#111111" }

unset_main = { fg = "#171717", bg = "#4FA5FF", bold = true }
unset_alt  = { fg = "#4FA5FF", bg = "#111111" }

[status]
overall = { bg = "#111111" }

# Permissions
perm_sep   = { fg = "#4C4C4C" }
perm_type  = { fg = "#56D0B3" }
perm_read  = { fg = "#FFE76D" }
perm_write = { fg = "#FC4651" }
perm_exec  = { fg = "#2EA85B" }

# Progress
progress_label  = { fg = "#8E8E8E", bold = true }
progress_normal = { fg = "#171717", bg = "#41B645" }
progress_error  = { fg = "#171717", bg = "#F74A4A" }

[which]
cols            = 3
mask            = { bg = "#111111" }
cand            = { fg = "#4FA5FF" }
rest            = { fg = "#8E8E8E" }
desc            = { fg = "#B3B3B3" }
separator_style = { fg = "#4C4C4C" }

[confirm]
border = { fg = "#266478" }
title  = { fg = "#35B0D8" }
body   = {}
list   = {}

btn_yes = { reversed = true }
btn_no  = {}

[spot]
border = { fg = "#266478" }
title  = { fg = "#35B0D8" }

tbl_col  = { fg = "#4FA5FF" }
tbl_cell = { fg = "#35B0D8", reversed = true }

[notify]
title_info  = { fg = "#41B645" }
title_warn  = { fg = "#EFB759" }
title_error = { fg = "#F74A4A" }

[pick]
border   = { fg = "#266478" }
active   = { fg = "#35B0D8", bold = true }
inactive = {}

[input]
border   = { fg = "#266478" }
title    = { fg = "#35B0D8" }
value    = {}
selected = { reversed = true }

[cmp]
border   = { fg = "#266478" }
active   = { reversed = true }
inactive = {}

[tasks]
border  = { fg = "#266478" }
title   = { fg = "#35B0D8" }
hovered = { fg = "#35B0D8", bold = true }

[help]
on      = { fg = "#56D0B3" }
run     = { fg = "#F2248C" }
desc    = { fg = "#8E8E8E" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#171717", bg = "#FFFFFF" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#66DAFF" },
	# Audio
	{ mime = "audio/*", fg = "#66DAFF" },
	# Video
	{ mime = "video/*", fg = "#D0A8FF" },
	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#FD8F3F" },
	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#4FA5FF" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#8E8E8E" },
	# Broken links
	{ url = "*", is = "orphan", fg = "#F74A4A" },
	# Executables
	{ url = "*", is = "exec", fg = "#2EA85B" },
	# Dummy files
	{ url = "*", is = "dummy", bg = "#8A2E34" },
	{ url = "*/", is = "dummy", bg = "#8A2E34" },
	# Fallback: directories are the accent, everything else the foreground
	{ url = "*/", fg = "#35B0D8" },
	{ url = "*", fg = "#FFFFFF" },
]
