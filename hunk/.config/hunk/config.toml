theme = "custom"

mode                   = "auto"   # auto, split, stack
vcs                    = "git"    # git, jj, sl
watch                  = false
exclude_untracked      = false
line_numbers           = true
wrap_lines             = false
agent_notes            = false
transparent_background = false

# ---------------------------------------------------------------------------
# Vesper theme
# Palette: https://github.com/raunofreiberg/vesper (the ANSI set Ghostty
# and herdr both draw with)
#
# bg            = "#101010"
# bg_panel      = "#161616"
# bg_selection  = "#232323"
# fg            = "#FFFFFF"
# muted         = "#505050"
# muted_text    = "#7E7E7E"
# subtle        = "#1C1C1C"
# red           = "#FF8080"
# green         = "#90B99F"
# yellow        = "#FFC799"
# blue          = "#F591B2"
# magenta       = "#ECAAD6"
# cyan          = "#B9AEDA"
# ---------------------------------------------------------------------------

[custom_theme]
base  = "dark-plus"
label = "Vesper"

# UI shell
background  = "#101010"
panel       = "#161616"
panelAlt    = "#282828"
border      = "#505050"
accent      = "#F591B2"
accentMuted = "#774A59"
text        = "#FFFFFF"
muted       = "#7E7E7E"

# Diff row backgrounds
addedBg        = "#232925"
removedBg      = "#322623"
movedAddedBg   = "#322328"
movedRemovedBg = "#31272D"
contextBg      = "#101010"

# Word-level (intra-line) highlights
addedContentBg   = "#3D4B42"
removedContentBg = "#60433D"
contextContentBg = "#232323"

# Gutter
lineNumberBg     = "#161616"
lineNumberFg     = "#505050"
addedSignColor   = "#86998D"
removedSignColor = "#B48E87"

# Selection
selectedHunk = "#232323"

# File status badges
badgeAdded   = "#86998D"
badgeRemoved = "#B48E87"
badgeNeutral = "#7E7E7E"

fileNew       = "#86998D"
fileDeleted   = "#B48E87"
fileRenamed   = "#F591B2"
fileModified  = "#E6B99D"
fileUntracked = "#7E7E7E"

# Agent notes
noteBorder          = "#F591B2"
noteBackground      = "#161616"
noteTitleBackground = "#322328"
noteTitleText       = "#FFFFFF"

[custom_theme.syntax_scopes]
# Comments
"comment"                        = "#7E7E7E"
"punctuation.definition.comment" = "#7E7E7E"

# Keywords / control flow  →  red
"keyword"              = "#FF8080"
"keyword.control"      = "#FF8080"
"keyword.operator"     = "#FF8080"
"storage"              = "#FF8080"
"storage.type"         = "#FF8080"

# Functions  →  magenta
"entity.name.function" = "#ECAAD6"
"support.function"     = "#ECAAD6"
"meta.function-call"   = "#ECAAD6"

# Types / classes  →  peach
"entity.name.type"     = "#FFC799"
"entity.name.class"    = "#FFC799"
"support.type"         = "#FFC799"
"support.class"        = "#FFC799"

# Strings  →  mint
"string"                        = "#99FFE4"
"string.quoted"                 = "#99FFE4"
"punctuation.definition.string" = "#99FFE4"

# Numbers / constants  →  pink
"constant.numeric"  = "#F591B2"
"constant.language" = "#F591B2"
"constant.other"    = "#F591B2"

# Preprocessor / includes  →  peach
"meta.preprocessor"      = "#FFC799"
"keyword.control.import" = "#FFC799"
"keyword.other.using"    = "#FFC799"

# Variables  →  white
"variable"       = "#FFFFFF"
"variable.other" = "#FFFFFF"

# Tags  →  pink
"entity.name.tag"            = "#F591B2"
"punctuation.definition.tag" = "#7E7E7E"

# Punctuation  →  muted
"punctuation"           = "#7E7E7E"
"punctuation.separator" = "#7E7E7E"

# Diff markup  →  muted green/red (matches row bg tone)
"markup.inserted" = "#86998D"
"markup.deleted"  = "#B48E87"
"markup.changed"  = "#F591B2"
