theme = "custom"

mode                   = "auto"   # auto, split, stack
vcs                    = "git"    # git, jj, sl
watch                  = false
exclude_untracked      = false
line_numbers           = true
wrap_lines             = false
agent_notes            = true
hunk_headers           = true
menu_bar               = true
copy_decorations       = false
cursor_line            = "row"
transparent_background = false

# ---------------------------------------------------------------------------
# Catppuccin Mocha theme (accent: mauve #cba6f7)
# Palette: https://github.com/catppuccin/palette — the full table is in
# docs/palette.md. Names below are upstream's own.
#
# There is no Catppuccin port for hunk, so unlike bat/yazi/lazygit/Sublime this
# block is transcribed by hand. `base = "dark-plus"` below is only a syntax
# fallback: hunk bundles a subset of shiki's themes and ships no Catppuccin, but
# every scope that matters is overridden in [custom_theme.syntax_scopes].
#
# base       = "#1e1e2e"  (also Ghostty's terminal background)
# mantle     = "#181825"
# crust      = "#11111b"
# surface0   = "#313244"
# surface1   = "#45475a"
# surface2   = "#585b70"
# overlay1   = "#7f849c"
# overlay2   = "#9399b2"
# subtext0   = "#a6adc8"
# text       = "#cdd6f4"
# red        = "#f38ba8"
# maroon     = "#eba0ac"
# green      = "#a6e3a1"
# teal       = "#94e2d5"
# sky        = "#89dceb"
# yellow     = "#f9e2af"
# peach      = "#fab387"
# mauve      = "#cba6f7"
# lavender   = "#b4befe"
# blue       = "#89b4fa"
# pink       = "#f5c2e7"
# rosewater  = "#f5e0dc"
#
# Catppuccin publishes no diff-background table, so the row and word-level
# backgrounds come from catppuccin/delta — the one upstream port that resolves
# the style guide's "green at 20% opacity" into opaque hex. Those values follow
# an exact rule (row = colour 20% into base, word = 35%), and the moved-row and
# gutter steps are extrapolated with the same rule. See docs/palette.md.
# ---------------------------------------------------------------------------

[custom_theme]
base  = "dark-plus"
label = "Catppuccin Mocha"

# UI shell
background  = "#1e1e2e"
panel       = "#181825"
panelAlt    = "#313244"
border      = "#585b70"
accent      = "#cba6f7"
accentMuted = "#5b4e74"
text        = "#cdd6f4"
muted       = "#7f849c"

# Diff row backgrounds — from catppuccin/delta (colour 20% into base)
addedBg        = "#394545"
removedBg      = "#493447"
movedAddedBg   = "#333c57"
movedRemovedBg = "#4a4548"
contextBg      = "#1e1e2e"

# Word-level (intra-line) highlights — colour 35% into base
addedContentBg   = "#4e6356"
removedContentBg = "#694559"
contextContentBg = "#313244"

# Gutter
lineNumberBg     = "#181825"
lineNumberFg     = "#585b70"
addedSignColor   = "#a6e3a1"
removedSignColor = "#f38ba8"

# Selection
selectedHunk = "#313244"

# File status badges
badgeAdded   = "#a6e3a1"
badgeRemoved = "#f38ba8"
badgeNeutral = "#7f849c"

fileNew       = "#a6e3a1"
fileDeleted   = "#f38ba8"
fileRenamed   = "#cba6f7"
fileModified  = "#f9e2af"
fileUntracked = "#7f849c"

# Agent notes
noteBorder          = "#cba6f7"
noteBackground      = "#181825"
noteTitleBackground = "#333c57"
noteTitleText       = "#cdd6f4"

[custom_theme.syntax_scopes]
# Slots follow Catppuccin's style guide: keyword=mauve, string=green,
# operator=sky, comment/punctuation=overlay2, constant+number=peach,
# function=blue, type/class/attribute=yellow, parameter=maroon, builtin=red,
# escape/regex=pink. Catppuccin names no variable colour, so variables inherit
# the plain foreground.

# Comments
"comment"                        = "#7f849c"
"punctuation.definition.comment" = "#7f849c"

# Keywords / control flow  →  mauve
"keyword"              = "#cba6f7"
"keyword.control"      = "#cba6f7"
"keyword.operator"     = "#89dceb"
"storage"              = "#cba6f7"
"storage.type"         = "#f9e2af"

# Functions  →  blue
"entity.name.function" = "#89b4fa"
"support.function"     = "#89b4fa"
"meta.function-call"   = "#89b4fa"

# Types / classes  →  yellow
"entity.name.type"     = "#f9e2af"
"entity.name.class"    = "#f9e2af"
"support.type"         = "#f9e2af"
"support.class"        = "#f9e2af"

# Strings  →  green
"string"                        = "#a6e3a1"
"string.quoted"                 = "#a6e3a1"
"punctuation.definition.string" = "#a6e3a1"

# Numbers and other constants  →  peach
"constant.numeric"  = "#fab387"
"constant.language" = "#fab387"
"constant.other"    = "#fab387"

# Preprocessor / includes  →  sky (operators)
"meta.preprocessor"      = "#89dceb"
"keyword.control.import" = "#89dceb"
"keyword.other.using"    = "#89dceb"

# Variables  →  plain fg (Catppuccin names no variable colour)
"variable"       = "#cdd6f4"
"variable.other" = "#cdd6f4"

# Tags  →  yellow (attributes)
"entity.name.tag"            = "#cba6f7"
"punctuation.definition.tag" = "#7f849c"

# Punctuation  →  overlay2
"punctuation"           = "#9399b2"
"punctuation.separator" = "#9399b2"

# Diff markup  →  green / red / yellow
"markup.inserted" = "#a6e3a1"
"markup.deleted"  = "#f38ba8"
"markup.changed"  = "#f9e2af"
