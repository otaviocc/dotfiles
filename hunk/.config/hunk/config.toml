theme = "custom"

mode                   = "auto"   # auto, split, stack
vcs                    = "git"    # git, jj, sl
watch                  = false
exclude_untracked      = false
line_numbers           = true
wrap_lines             = false
agent_notes            = false
transparent_background = false

# ---------------------------------------------------------------------------
# Kanagawa Dragon theme (accent: yellow #c4b28a)
# Palette: https://github.com/rebelot/kanagawa.nvim — the full table is in
# docs/palette.md. Names below are upstream's own.
#
# bg         = "#181616"  (dragonBlack3, also Ghostty's terminal background)
# bg_m2      = "#12120f"  (dragonBlack1)
# bg_m3      = "#0d0c0c"  (dragonBlack0)
# bg_p1      = "#282727"  (dragonBlack4)
# whitespace = "#625e5a"  (dragonBlack6)
# selection  = "#223249"  (waveBlue1 — the one cool colour Dragon keeps)
# fg         = "#c5c9c5"  (dragonWhite)
# comment    = "#737c73"  (dragonAsh)
# red        = "#c4746e"  (dragonRed)
# green      = "#8a9a7b"  (dragonGreen2)
# yellow     = "#c4b28a"  (dragonYellow)
# orange     = "#b6927b"  (dragonOrange)
# violet     = "#8992a7"  (dragonViolet)
# aqua       = "#8ea4a2"  (dragonAqua)
# pink       = "#a292a3"  (dragonPink)
# blue       = "#8ba4b0"  (dragonBlue2)
#
# The diff row backgrounds are Kanagawa's own `diff` table (winterGreen /
# winterRed / winterBlue / winterYellow) and the muted signs its `vcs` table
# (autumnGreen / autumnRed) — nothing blended. Only the word-level and gutter
# steps are extrapolated, by mixing the matching vcs colour into bg.
# ---------------------------------------------------------------------------

[custom_theme]
base  = "dark-plus"
label = "Kanagawa Dragon"

# UI shell
background  = "#181616"
panel       = "#12120f"
panelAlt    = "#282727"
border      = "#625e5a"
accent      = "#c4b28a"
accentMuted = "#544d3f"
text        = "#c5c9c5"
muted       = "#737c73"

# Diff row backgrounds — Kanagawa's own diff table, verbatim
addedBg        = "#2b3328"
removedBg      = "#43242b"
movedAddedBg   = "#252535"
movedRemovedBg = "#49443c"
contextBg      = "#181616"

# Word-level (intra-line) highlights — vcs colour 35% into bg
addedContentBg   = "#394233"
removedContentBg = "#542526"
contextContentBg = "#223249"

# Gutter
lineNumberBg     = "#12120f"
lineNumberFg     = "#625e5a"
addedSignColor   = "#76946a"
removedSignColor = "#c34043"

# Selection
selectedHunk = "#223249"

# File status badges
badgeAdded   = "#76946a"
badgeRemoved = "#c34043"
badgeNeutral = "#737c73"

fileNew       = "#76946a"
fileDeleted   = "#c34043"
fileRenamed   = "#c4b28a"
fileModified  = "#dca561"
fileUntracked = "#737c73"

# Agent notes
noteBorder          = "#c4b28a"
noteBackground      = "#12120f"
noteTitleBackground = "#252535"
noteTitleText       = "#c5c9c5"

[custom_theme.syntax_scopes]
# Slots follow Dragon's own `syn` table in kanagawa.nvim's themes.lua:
# keyword/statement=violet, operator/preproc/regex=red, type=aqua, fun=blue,
# identifier=yellow, constant=orange, number=pink, string=green,
# parameter=param, punct=punct, comment=comment. Dragon sets
# syn.variable="none", so variables inherit the plain foreground.

# Comments
"comment"                        = "#737c73"
"punctuation.definition.comment" = "#737c73"

# Keywords / control flow  →  violet
"keyword"              = "#8992a7"
"keyword.control"      = "#8992a7"
"keyword.operator"     = "#c4746e"
"storage"              = "#8992a7"
"storage.type"         = "#8ea4a2"

# Functions  →  blue
"entity.name.function" = "#8ba4b0"
"support.function"     = "#8ba4b0"
"meta.function-call"   = "#8ba4b0"

# Types / classes  →  aqua
"entity.name.type"     = "#8ea4a2"
"entity.name.class"    = "#8ea4a2"
"support.type"         = "#8ea4a2"
"support.class"        = "#8ea4a2"

# Strings  →  green
"string"                        = "#8a9a7b"
"string.quoted"                 = "#8a9a7b"
"punctuation.definition.string" = "#8a9a7b"

# Numbers  →  pink; other constants  →  orange
"constant.numeric"  = "#a292a3"
"constant.language" = "#b6927b"
"constant.other"    = "#b6927b"

# Preprocessor / includes  →  red
"meta.preprocessor"      = "#c4746e"
"keyword.control.import" = "#c4746e"
"keyword.other.using"    = "#c4746e"

# Variables  →  plain fg (Dragon sets syn.variable = "none")
"variable"       = "#c5c9c5"
"variable.other" = "#c5c9c5"

# Tags  →  identifier yellow
"entity.name.tag"            = "#c4b28a"
"punctuation.definition.tag" = "#737c73"

# Punctuation  →  punct
"punctuation"           = "#9e9b93"
"punctuation.separator" = "#9e9b93"

# Diff markup  →  Kanagawa's own vcs table
"markup.inserted" = "#76946a"
"markup.deleted"  = "#c34043"
"markup.changed"  = "#dca561"
